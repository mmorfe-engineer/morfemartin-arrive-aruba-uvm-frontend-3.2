name: Validación del sitio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    name: Compila el sitio con webpack
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción (HTML y CSS minificados)
        run: npm run build
