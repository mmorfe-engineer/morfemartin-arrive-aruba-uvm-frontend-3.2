<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320"><defs></defs><rect x="0" y="0" width="1440" height="6000" rx="0" fill="#f0f0e5" opacity="1"/><rect x="0" y="0" width="1440" height="76" rx="0" fill="#ffffff" stroke="#e5e2d8" stroke-width="1" opacity="1"/><path transform="translate(64,27.0) scale(0.9166666666666666)" fill="#386395" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="96" y="44" font-family="Cormorant Garamond, Georgia, serif" font-size="19" font-weight="600" fill="#2c4e78" text-anchor="start">Arrive Aruba</text><text x="902" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Inicio</text><text x="980" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Catálogo</text><text x="1074" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Reserva</text><text x="1161" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Nosotros</text><text x="1255" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Mis pedidos</text><text x="720" y="110" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">RESERVA</text><text x="720" y="136" font-family="Cormorant Garamond, Georgia, serif" font-size="40" font-weight="600" fill="#1c2b3a" text-anchor="middle">Reserva tu prenda</text><text x="720" y="176" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="middle">Elige la prenda, completa tus datos y tu reserva queda</text><text x="720" y="196" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="middle">guardada en este navegador, lista para recoger.</text><text x="64" y="250" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Nombre completo *</text><rect x="64" y="260" width="640" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="64" y="336" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Correo electrónico *</text><rect x="64" y="346" width="640" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="64" y="422" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Teléfono</text><rect x="64" y="432" width="640" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="64" y="508" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Prenda *</text><rect x="64" y="518" width="640" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="686" y="545" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">▾</text><text x="64" y="594" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Cantidad *</text><rect x="64" y="604" width="640" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="686" y="631" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">▾</text><text x="64" y="680" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Notas</text><rect x="64" y="690" width="640" height="88" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><line x1="78" y1="756" x2="134" y2="756" stroke="#c9c9c9" stroke-width="2"/><rect x="64" y="796" width="640" height="48" rx="24" fill="#2c4e78" opacity="1"/><text x="384" y="826" font-family="Geologica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Guardar reserva</text><text x="64" y="874" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">Al guardar verás la confirmación y el pedido aparecerá</text><text x="64" y="892" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">en «Mis pedidos».</text><rect x="0" y="926" width="1440" height="26" rx="0" fill="#ffffff" opacity="1"/><text x="64" y="966" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="start" letter-spacing="0.14em">SIN VUELTAS</text><text x="64" y="992" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" fill="#1c2b3a" text-anchor="start">Cómo funciona tu reserva</text><text x="64" y="1032" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">01</text><text x="108" y="1035" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Eliges y reservas</text><text x="64" y="1066" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Marcas la prenda, la talla y cuántas llevas.</text><text x="517" y="1032" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">02</text><text x="561" y="1035" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Queda guardada</text><text x="517" y="1066" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">El pedido se guarda en la base de datos</text><text x="517" y="1086" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">de este navegador, sin servidores.</text><text x="970" y="1032" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">03</text><text x="1014" y="1035" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Recoges a tu llegada</text><text x="970" y="1066" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Nosotros preparamos el paquete; tú lo</text><text x="970" y="1086" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">recoges cuando aterrices.</text><rect x="0" y="1146" width="1440" height="150" rx="0" fill="#2c4e78" opacity="1"/><path transform="translate(64,1172) scale(0.8333333333333334)" fill="#f0f0e5" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="92" y="1188" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Arrive Aruba</text><text x="64" y="1214" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Ropa resort nacida en Aruba. Adaptación académica de la</text><text x="64" y="1232" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">identidad de la marca para la e-actividad de Frontend.</text><text x="600" y="1188" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Explorar</text><text x="600" y="1214" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Inicio</text><text x="600" y="1234" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Catálogo</text><text x="600" y="1254" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Producto destacado</text><text x="600" y="1274" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Nosotros</text><text x="1206" y="1188" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Atención al pasajero</text><text x="1206" y="1214" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Reservar una prenda</text><text x="1206" y="1234" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Mis pedidos</text><text x="1206" y="1254" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">hola@arrivearuba.isla</text><line x1="64" y1="1264" x2="1376" y2="1264" stroke="#3f5f8a" stroke-width="1"/><text x="64" y="1284" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa3ba" text-anchor="start">© 2026 Arrive Aruba · e-actividad 3.2 · Frontend · Universidad Valle del Momboy</text><text x="1376" y="1284" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa3ba" text-anchor="end">Hecho con HTML, CSS y JavaScript, sin plantillas.</text></svg>