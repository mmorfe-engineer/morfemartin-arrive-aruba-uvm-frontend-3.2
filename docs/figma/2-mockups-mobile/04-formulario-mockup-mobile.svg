h="335" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="20" y="404" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Teléfono</text><rect x="20" y="414" width="335" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="20" y="490" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Prenda *</text><rect x="20" y="500" width="335" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="337" y="527" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">▾</text><text x="20" y="576" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Cantidad *</text><rect x="20" y="586" width="335" height="44" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><text x="337" y="613" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">▾</text><text x="20" y="662" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Notas</text><rect x="20" y="672" width="335" height="88" rx="10" fill="#ffffff" stroke="#d5d1c2" stroke-width="1" opacity="1"/><line x1="34" y1="738" x2="90" y2="738" stroke="#c9c9c9" stroke-width="2"/><rect x="20" y="778" width="335" height="48" rx="24" fill="#2c4e78" opacity="1"/><text x="188" y="808" font-family="Geologica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Guardar reserva</text><text x="20" y="856" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">Al guardar verás la confirmación y el pedido aparecerá</text><text x="20" y="874" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5b6c" text-anchor="start">en «Mis pedidos».</text><rect x="0" y="908" width="375" height="26" rx="0" fill="#ffffff" opacity="1"/><text x="20" y="948" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="start" letter-spacing="0.14em">SIN VUELTAS</text><text x="20" y="974" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#1c2b3a" text-anchor="start">Cómo funciona tu reserva</text><text x="20" y="1014" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#d8d4c4" text-anchor="start">01</text><text x="62" y="1016" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Eliges y reservas</text><text x="20" y="1042" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">Marcas la prenda, la talla y cuántas llevas.</text><text x="20" y="1080" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#d8d4c4" text-anchor="start">02</text><text x="62" y="1082" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Queda guardada</text><text x="20" y="1108" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">El pedido se guarda en la base de datos</text><text x="20" y="1126" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">de este navegador, sin servidores.</text><text x="20" y="1164" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#d8d4c4" text-anchor="start">03</text><text x="62" y="1166" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Recoges a tu llegada</text><text x="20" y="1192" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">Nosotros preparamos el paquete; tú lo</text><text x="20" y="1210" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">recoges cuando aterrices.</text><rect x="0" y="1254" width="375" height="180" rx="0" fill="#2c4e78" opacity="1"/><path transform="translate(20,1276) scale(0.8333333333333334)" fill="#f0f0e5" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="48" y="1292" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Arrive Aruba</text><text x="20" y="1316" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Ropa resort nacida en Aruba. Adaptación académica de la identidad de la marca.</text><text x="20" y="1340" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">— — —</text><text x="20" y="1358" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Explorar</text><text x="20" y="1378" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">Inicio · Catálogo · Producto</text><text x="20" y="1395" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">Nosotros</text><text x="20" y="1420" font-family="Geologica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa3ba" text-anchor="start">© 2026 Arrive Aruba · e-actividad 3.2 · Frontend · UVM</text></svg>