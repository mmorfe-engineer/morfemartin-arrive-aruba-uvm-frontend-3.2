<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1412" viewBox="0 0 375 1412"><defs></defs><rect x="0" y="0" width="375" height="6000" rx="0" fill="#f0f0e5" opacity="1"/><rect x="0" y="0" width="375" height="58" rx="0" fill="#ffffff" stroke="#e5e2d8" stroke-width="1" opacity="1"/><path transform="translate(20,18.0) scale(0.9166666666666666)" fill="#386395" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="50" y="35" font-family="Cormorant Garamond, Georgia, serif" font-size="19" font-weight="600" fill="#2c4e78" text-anchor="start">Arrive Aruba</text><line x1="333" y1="20" x2="357" y2="20" stroke="#1c2b3a" stroke-width="2"/><line x1="333" y1="27" x2="357" y2="27" stroke="#1c2b3a" stroke-width="2"/><line x1="333" y1="34" x2="357" y2="34" stroke="#1c2b3a" stroke-width="2"/><text x="188" y="92" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">LA MARCA</text><text x="188" y="118" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#1c2b3a" text-anchor="middle">Llegamos para quedarnos</text><text x="188" y="160" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="middle">Pocas piezas, hechas con materia honesta en un taller</text><text x="188" y="180" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="middle">local de la isla. Ropa resort con la paleta del atardecer.</text><rect x="0" y="214" width="375" height="26" rx="0" fill="#ffffff" opacity="1"/><text x="188" y="258" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">SIN EXCEPCIONES</text><text x="188" y="284" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#1c2b3a" text-anchor="middle">Tres valores, ninguna excepción</text><rect x="20" y="324" width="335" height="120" rx="16" fill="#f7f5ec" opacity="1"/><text x="38" y="354" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Pocas piezas</text><text x="38" y="380" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Una selección corta por temporada: menos</text><text x="38" y="398" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> opciones, mejor elegidas.</text><rect x="20" y="456" width="335" height="120" rx="16" fill="#f7f5ec" opacity="1"/><text x="38" y="486" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Taller local</text><text x="38" y="512" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Cada prenda se corta y se cose en la isla,</text><text x="38" y="530" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> con manos que conocen el calor.</text><rect x="20" y="588" width="335" height="120" rx="16" fill="#f7f5ec" opacity="1"/><text x="38" y="618" font-family="Cormorant Garamond, Georgia, serif" font-size="16.5" font-weight="600" fill="#1c2b3a" text-anchor="start">Materia honesta</text><text x="38" y="644" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Lino y algodón declarados, sin fibras</text><text x="38" y="662" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> misteriosas ni promesas raras.</text><text x="188" y="720" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">DEL BOCETO AL PAQUETE</text><text x="188" y="746" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#1c2b3a" text-anchor="middle">Cómo llega cada prenda</text><text x="20" y="786" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#d8d4c4" text-anchor="start">01</text><text x="56" y="788" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#1c2b3a" text-anchor="start">Se dibuja</text><text x="56" y="808" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">El boceto nace del viaje real.</text><text x="20" y="838" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#d8d4c4" text-anchor="start">02</text><text x="56" y="840" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#1c2b3a" text-anchor="start">Se prueba</text><text x="56" y="860" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Se ajusta sobre cuerpos de la isla.</text><text x="20" y="890" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#d8d4c4" text-anchor="start">03</text><text x="56" y="892" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#1c2b3a" text-anchor="start">Se cose</text><text x="56" y="912" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Costuras vistas, prolijas, sin atajos.</text><text x="20" y="942" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#d8d4c4" text-anchor="start">04</text><text x="56" y="944" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#1c2b3a" text-anchor="start">Se reserva</text><text x="56" y="964" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a5b6c" text-anchor="start">La prenda espera a su pasajero.</text><rect x="0" y="1018" width="375" height="190" rx="0" fill="#2c4e78" opacity="1"/><text x="188" y="1070" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f5a169" text-anchor="middle" letter-spacing="0.14em">YA SABES QUIÉNES SOMOS</text><text x="188" y="1110" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Elige tu prenda.</text><rect x="92" y="1142" width="190" height="42" rx="21" fill="#ffffff" opacity="1"/><text x="188" y="1169" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2c4e78" text-anchor="middle">Ver el catálogo</text><rect x="0" y="1208" width="375" height="180" rx="0" fill="#2c4e78" opacity="1"/><path transform="translate(20,1230) scale(0.8333333333333334)" fill="#f0f0e5" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="48" y="1246" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Arrive Aruba</text><text x="20" y="1270" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Ropa resort nacida en Aruba. Adaptación académica de la identidad de la marca.</text><text x="20" y="1294" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">— — —</text><text x="20" y="1312" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Explorar</text><text x="20" y="1332" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">Inicio · Catálogo · Producto</text><text x="20" y="1349" font-family="Geologica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9c6d6" text-anchor="start">Nosotros</text><text x="20" y="1374" font-family="Geologica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8fa3ba" text-anchor="start">© 2026 Arrive Aruba · e-actividad 3.2 · Frontend · UVM</text></svg>