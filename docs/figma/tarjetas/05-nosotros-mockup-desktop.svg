<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="908" viewBox="0 0 1440 908"><defs></defs><rect x="0" y="0" width="1440" height="6000" rx="0" fill="#f0f0e5" opacity="1"/><rect x="0" y="0" width="1440" height="76" rx="0" fill="#ffffff" stroke="#e5e2d8" stroke-width="1" opacity="1"/><path transform="translate(64,27.0) scale(0.9166666666666666)" fill="#386395" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="96" y="44" font-family="Cormorant Garamond, Georgia, serif" font-size="19" font-weight="600" fill="#2c4e78" text-anchor="start">Arrive Aruba</text><text x="902" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Inicio</text><text x="980" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Catálogo</text><text x="1074" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Reserva</text><text x="1161" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Nosotros</text><text x="1255" y="43" font-family="Geologica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1c2b3a" text-anchor="start">Mis pedidos</text><text x="720" y="110" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">LA MARCA</text><text x="720" y="136" font-family="Cormorant Garamond, Georgia, serif" font-size="40" font-weight="600" fill="#1c2b3a" text-anchor="middle">Llegamos para quedarnos</text><text x="720" y="178" font-family="Geologica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b6c" text-anchor="middle">Pocas piezas, hechas con materia honesta en un taller</text><text x="720" y="198" font-family="Geologica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b6c" text-anchor="middle">local de la isla. Ropa resort con la paleta del atardecer.</text><rect x="0" y="232" width="1440" height="26" rx="0" fill="#ffffff" opacity="1"/><text x="720" y="276" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">SIN EXCEPCIONES</text><text x="720" y="302" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" fill="#1c2b3a" text-anchor="middle">Tres valores, ninguna excepción</text><rect x="64" y="342" width="410" height="150" rx="18" fill="#f7f5ec" opacity="1"/><text x="92" y="384" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="600" fill="#1c2b3a" text-anchor="start">Pocas piezas</text><text x="92" y="420" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Una selección corta por temporada: menos</text><text x="92" y="442" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> opciones, mejor elegidas.</text><rect x="514" y="342" width="410" height="150" rx="18" fill="#f7f5ec" opacity="1"/><text x="542" y="384" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="600" fill="#1c2b3a" text-anchor="start">Taller local</text><text x="542" y="420" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Cada prenda se corta y se cose en la isla,</text><text x="542" y="442" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> con manos que conocen el calor.</text><rect x="964" y="342" width="410" height="150" rx="18" fill="#f7f5ec" opacity="1"/><text x="992" y="384" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="600" fill="#1c2b3a" text-anchor="start">Materia honesta</text><text x="992" y="420" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start">Lino y algodón declarados, sin fibras</text><text x="992" y="442" font-family="Geologica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a5b6c" text-anchor="start"> misteriosas ni promesas raras.</text><text x="720" y="536" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#386395" text-anchor="middle" letter-spacing="0.14em">DEL BOCETO AL PAQUETE</text><text x="720" y="562" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" fill="#1c2b3a" text-anchor="middle">Cómo llega cada prenda</text><text x="64" y="602" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">01</text><text x="64" y="638" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Se dibuja</text><text x="64" y="664" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">El boceto nace del viaje real.</text><text x="400" y="602" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">02</text><text x="400" y="638" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Se prueba</text><text x="400" y="664" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">Se ajusta sobre cuerpos de la isla.</text><text x="736" y="602" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">03</text><text x="736" y="638" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Se cose</text><text x="736" y="664" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">Costuras vistas, prolijas, sin atajos.</text><text x="1072" y="602" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#d8d4c4" text-anchor="start">04</text><text x="1072" y="638" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#1c2b3a" text-anchor="start">Se reserva</text><text x="1072" y="664" font-family="Geologica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4a5b6c" text-anchor="start">La prenda espera a su pasajero.</text><rect x="0" y="730" width="1440" height="180" rx="0" fill="#2c4e78" opacity="1"/><text x="64" y="792" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f5a169" text-anchor="start" letter-spacing="0.14em">YA SABES QUIÉNES SOMOS</text><text x="64" y="834" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" fill="#ffffff" text-anchor="start">Elige tu prenda.</text><rect x="1156" y="790" width="220" height="48" rx="24" fill="#ffffff" opacity="1"/><text x="1266" y="821" font-family="Geologica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c4e78" text-anchor="middle">Ver el catálogo</text><rect x="0" y="910" width="1440" height="150" rx="0" fill="#2c4e78" opacity="1"/><path transform="translate(64,936) scale(0.8333333333333334)" fill="#f0f0e5" d="M12 1l2.5 7.5H22l-6 4.6 2.3 7.4L12 16l-6.3 4.5L8 13.1 2 8.5h7.5z"/><text x="92" y="952" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Arrive Aruba</text><text x="64" y="978" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Ropa resort nacida en Aruba. Adaptación académica de la</text><text x="64" y="996" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">identidad de la marca para la e-actividad de Frontend.</text><text x="600" y="952" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Explorar</text><text x="600" y="978" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Inicio</text><text x="600" y="998" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Catálogo</text><text x="600" y="1018" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Producto destacado</text><text x="600" y="1038" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Nosotros</text><text x="1206" y="952" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">Atención al pasajero</text><text x="1206" y="978" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Reservar una prenda</text><text x="1206" y="998" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">Mis pedidos</text><text x="1206" y="1018" font-family="Geologica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9c6d6" text-anchor="start">hola@arrivearuba.isla</text><line x1="64" y1="1028" x2="1376" y2="1028" stroke="#3f5f8a" stroke-width="1"/><text x="64" y="1048" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa3ba" text-anchor="start">© 2026 Arrive Aruba · e-actividad 3.2 · Frontend · Universidad Valle del Momboy</text><text x="1376" y="1048" font-family="Geologica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8fa3ba" text-anchor="end">Hecho con HTML, CSS y JavaScript, sin plantillas.</text></svg>